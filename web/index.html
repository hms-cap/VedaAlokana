<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vedālokana — browse Veda mantras</title>
<meta name="description" content="Browse the four Veda Saṃhitās by structure, ṛṣi, devatā and chandas, from open scholarly data.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gentium+Book+Plus:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Serif+Devanagari:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 3c3 4 5 6.5 5 10a5 5 0 0 1-10 0c0-3.5 2-6 5-10z' fill='%23C2410C'/%3E%3C/svg%3E">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="topbar">
  <button class="icon-btn menu-btn" id="menuBtn" aria-label="Open navigation" aria-controls="rail" aria-expanded="false">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
  <a href="#/" class="brand">
    <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3c3 4 5 6.5 5 10a5 5 0 0 1-10 0c0-3.5 2-6 5-10z" fill="#C2410C"/><path d="M12 11c1.2 1.6 2 2.6 2 4a2 2 0 0 1-4 0c0-1.4.8-2.4 2-4z" fill="#F5F6F4"/></svg>
    <span>Vedālokana</span>
  </a>
  <form class="search" id="searchForm" role="search">
    <label for="q" class="sr">Jump to a mantra or find a name</label>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
    <input id="q" autocomplete="off" placeholder="1.1.1, Agni, अग्नि, Vasiṣṭha…">
    <div class="suggest" id="suggest" role="listbox" hidden></div>
  </form>
</header>
<div class="shell">
  <nav class="rail" id="rail" aria-label="Saṃhitās and facets"></nav>
  <div class="scrim" id="scrim" hidden></div>
  <main id="main" tabindex="-1"></main>
</div>
<script type="module" src="app.js"></script>
