name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Search indexes are up to date
        run: node scripts/check-search-fresh.mjs
      - name: All tests
        run: node scripts/test-all.mjs
